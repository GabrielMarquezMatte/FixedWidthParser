name: Benchmarks → GitHub Pages

# Runs on every push to master. Benchmark classes are split across parallel
# runners and the results are merged and published to GitHub Pages.
#
# Prerequisites (one-time setup in GitHub repo settings):
#   Settings → Pages → Source: "Deploy from a branch" → Branch: gh-pages / root
#
# Published chart: https://<owner>.github.io/<repo>/dev/bench/

on:
  push:
    branches: [master]

concurrency:
  group: benchmark-pages
  cancel-in-progress: true

permissions:
  contents: write   # needed to push data to the gh-pages branch

jobs:
  benchmark:
    name: Run (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          # Space-separated fully-qualified class patterns.
          # Each pattern becomes a separate --filter flag (BenchmarkDotNet ORs them).
          - name: parser
            filter: >-
              Benchmarks.Perf.ParserBenchmarks.*
              Benchmarks.Perf.SourceGenParserBenchmarks.*
              Benchmarks.Perf.IntHeavyParserBenchmarks.*
          - name: reader
            filter: >-
              Benchmarks.Perf.ReaderBenchmarks.*
              Benchmarks.Perf.ReaderStartupBenchmarks.*
              Benchmarks.Perf.AsyncReaderBenchmarks.*
          - name: byte
            filter: >-
              Benchmarks.Perf.ByteReaderBenchmarks.*
              Benchmarks.Perf.ByteReaderPoolingBenchmarks.*
              Benchmarks.Perf.ByteReaderStreamBenchmarks.*
          - name: writer
            filter: Benchmarks.Perf.WriterBenchmarks.*

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Benchmarks/Benchmarks.csproj

      - name: Build (Release)
        run: dotnet build tests/Benchmarks/Benchmarks.csproj --configuration Release --no-restore

      - name: Run benchmarks
        run: |
          # Build one --filter arg per space-separated pattern.
          # Single-quoting the substitution prevents bash glob-expanding the '*'.
          IFS=' ' read -ra patterns <<< '${{ matrix.group.filter }}'
          filter_args=()
          for pattern in "${patterns[@]}"; do
            filter_args+=(--filter "$pattern")
          done
          dotnet run --project tests/Benchmarks/Benchmarks.csproj \
            --configuration Release --no-build \
            -- "${filter_args[@]}" --warmupCount 3 --iterationCount 10

      - name: Upload JSON results
        uses: actions/upload-artifact@v4
        with:
          name: bench-json-${{ matrix.group.name }}
          path: BenchmarkDotNet.Artifacts/results/*-report-full.json
          retention-days: 1

  publish:
    name: Publish to Pages
    needs: benchmark
    # Run even when some matrix shards fail so partial results are still published.
    if: always() && needs.benchmark.result != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - name: Download all JSON results
        uses: actions/download-artifact@v4
        with:
          pattern: bench-json-*
          merge-multiple: true
          path: results/

      - name: Combine JSON files
        run: |
          jq -s '{
            "Title": "FixedWidthParser Benchmarks",
            "Benchmarks": [.[].Benchmarks[]]
          }' results/*.json > combined-report.json

      - name: Publish to GitHub Pages
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: benchmarkdotnet
          output-file-path: combined-report.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          # Post a commit comment on master when any metric regresses beyond 150%.
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
