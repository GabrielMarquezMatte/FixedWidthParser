name: Benchmarks → GitHub Pages

# Runs on each push to master that can move a benchmark. The groups in tests/Benchmarks/benchmark-groups.json
# run on parallel runners, and the results are merged and published to GitHub Pages, where benchmark-pr.yml
# reads them as its baseline.
#
# Prerequisites (one-time setup in GitHub repo settings):
#   Settings → Pages → Source: "Deploy from a branch" → Branch: gh-pages / root
#
# Published chart: https://<owner>.github.io/<repo>/dev/bench/

on:
  push:
    branches: [master]
    paths:
      - 'src/FixedWidthParser/**'
      - 'src/FixedWidthParser.Generator/**'
      - 'tests/Benchmarks/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/benchmark-pages.yml'

concurrency:
  group: benchmark-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  groups:
    name: Load benchmark groups
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: load
        run: echo "matrix=$(jq -c . tests/Benchmarks/benchmark-groups.json)" >> "$GITHUB_OUTPUT"

  benchmark:
    name: Run (${{ matrix.group.name }})
    needs: groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore tests/Benchmarks/Benchmarks.csproj

      - name: Build (Release)
        run: dotnet build tests/Benchmarks/Benchmarks.csproj --configuration Release --no-restore -p:RunAnalyzers=false

      - name: Run benchmarks
        run: |
          # --filter takes several space-separated patterns as values of one flag; single-quoting the
          # substitution keeps bash from glob-expanding the '*'.
          IFS=' ' read -ra patterns <<< '${{ matrix.group.filter }}'
          dotnet run --project tests/Benchmarks/Benchmarks.csproj \
            --configuration Release --no-build \
            -- --filter "${patterns[@]}" ${{ matrix.group.pagesArgs }}

      - name: Upload JSON results
        uses: actions/upload-artifact@v7
        with:
          name: bench-json-${{ matrix.group.name }}
          path: BenchmarkDotNet.Artifacts/results/*-report-full.json
          retention-days: 1

  publish:
    name: Publish to Pages
    needs: benchmark
    # Run even when some matrix shards fail so partial results are still published.
    if: always() && needs.benchmark.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pushes to the gh-pages branch

    steps:
      - uses: actions/checkout@v7

      - name: Download all JSON results
        uses: actions/download-artifact@v8
        with:
          pattern: bench-json-*
          merge-multiple: true
          path: results/

      - name: Combine JSON files
        run: |
          jq -s '{
            "Title": "FixedWidthParser Benchmarks",
            "Benchmarks": [.[].Benchmarks[]]
          }' results/*.json > combined-report.json

      - name: Publish to GitHub Pages
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: benchmarkdotnet
          output-file-path: combined-report.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          # Post a commit comment on master when any metric regresses beyond 150%.
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
