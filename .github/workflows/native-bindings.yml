name: Native bindings

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: native-bindings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      bindings: ${{ steps.filter.outputs.bindings }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            bindings:
              - 'src/FixedWidthParser/**'
              - 'src/FixedWidthParser.Native/**'
              - 'python/**'
              - 'cpp/**'
              - 'tests/FixedWidthParser.NativeSmoke/**'
              - '.github/workflows/native-bindings.yml'

  build-native:
    name: Build native library (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.bindings == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish the native library into the Python package
        shell: bash
        env:
          RunAnalyzers: 'false'
        run: python python/scripts/build_native.py

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/fixedwidth/_lib/*
          if-no-files-found: error

  test-bindings:
    name: Python + C + C++ (${{ matrix.os }})
    needs: [changes, build-native]
    if: needs.changes.outputs.bindings == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/fixedwidth/_lib

      - name: Restore executable bit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x python/src/fixedwidth/_lib/*

      - name: Install the Python package
        run: pip install -e "python[dev,pandas,polars]"

      - name: Run the Python tests
        run: pytest python/tests -v

      - name: Run the Python benchmark (smoke)
        run: python python/benchmarks/bench_read.py --lines 2000 --runs 1

      # lib.exe, which turns fixedwidth.def into an import library, is only on PATH in a developer prompt.
      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and run the C smoke test
        run: |
          cmake -S tests/FixedWidthParser.NativeSmoke -B build/nativesmoke -DCMAKE_BUILD_TYPE=Release
          cmake --build build/nativesmoke --config Release
          ctest --test-dir build/nativesmoke --output-on-failure -C Release

      - name: Build and run the C++ tests
        run: |
          cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp --config Release
          ctest --test-dir build/cpp --output-on-failure -C Release
