name: Native bindings

on:
  # develop is covered by its pull request into master; a push trigger there would run everything twice.
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: native-bindings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      python: ${{ steps.filter.outputs.python }}
      cpp: ${{ steps.filter.outputs.cpp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A change to the native library tests every binding; a change to one binding tests only that one.
      - name: Filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            native:
              - 'src/FixedWidthParser/**'
              - 'src/FixedWidthParser.Native/**'
              - 'Directory.Build.props'
              - 'global.json'
              - 'python/scripts/build_native.py'
              - '.github/workflows/native-bindings.yml'
            python:
              - 'python/**'
              - 'tests/FixedWidthParser.NativeSmoke/**'
            cpp:
              - 'cpp/**'

  # Every platform a release ships, so a release never builds one for the first time.
  build-native:
    name: Build native library (${{ matrix.os }})
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.cpp == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish the native library into the Python package
        shell: bash
        env:
          RunAnalyzers: 'false'
        run: python python/scripts/build_native.py

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/fixedwidth/_lib/*
          if-no-files-found: error

  test-python:
    name: Python + C smoke (${{ matrix.os }})
    needs: [changes, build-native]
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/fixedwidth/_lib

      - name: Restore executable bit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x python/src/fixedwidth/_lib/*

      - name: Install the Python package
        run: pip install -e "python[dev,pandas,polars]" ${{ matrix.os == 'ubuntu-latest' && 'pytest-cov' || '' }}

      - name: Run the Python tests
        run: >-
          pytest python/tests -v
          ${{ matrix.os == 'ubuntu-latest' && '--cov=fixedwidth --cov-report=xml:coverage-python.xml' || '' }}

      - name: Upload Python coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-python.xml
          flags: python
          fail_ci_if_error: false

      - name: Build the wheel and check it installs here
        run: |
          pip install build
          python -m build --wheel python/ --outdir dist/
          python python/scripts/check_wheel_tag.py dist

      - name: Run the Python benchmark (smoke)
        run: python python/benchmarks/bench_read.py --lines 2000 --runs 1

      # lib.exe, which turns fixedwidth.def into an import library, is only on PATH in a developer prompt.
      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and run the C smoke test
        run: |
          cmake -S tests/FixedWidthParser.NativeSmoke -B build/nativesmoke -DCMAKE_BUILD_TYPE=Release
          cmake --build build/nativesmoke --config Release
          ctest --test-dir build/nativesmoke --output-on-failure -C Release

  test-musl:
    name: musl library + Python (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build, test and wheel in Alpine
        env:
          RunAnalyzers: 'false'
        run: sh python/scripts/build_musl_wheel.sh

  test-cpp:
    name: C++ wrapper (${{ matrix.os }})
    needs: [changes, build-native]
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.cpp == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download native library
        uses: actions/download-artifact@v8
        with:
          name: native-lib-${{ matrix.os }}
          path: python/src/fixedwidth/_lib

      - name: Restore executable bit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x python/src/fixedwidth/_lib/*

      # lib.exe, which turns fixedwidth.def into an import library, is only on PATH in a developer prompt.
      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and run the C++ tests
        run: |
          cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp --config Release
          ctest --test-dir build/cpp --output-on-failure -C Release

  # The one check branch protection requires from this workflow. A matrix job skipped by its `if` never reports
  # its expanded name, so requiring those names would leave the check pending whenever no binding changed.
  result:
    name: Bindings result
    needs: [changes, build-native, test-python, test-musl, test-cpp]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A bindings job failed or was cancelled."
          exit 1
