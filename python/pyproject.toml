[build-system]
requires = ["hatchling", "packaging"]
build-backend = "hatchling.build"

[project]
name = "fixedwidthparser"
version = "0.1.0"
description = "Read and write fixed-width files through the FixedWidthParser NativeAOT library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gabriel Matte" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
numpy = ["numpy>=1.21"]
pyarrow = ["pyarrow>=14.0"]
pandas = ["pandas>=2.0", "pyarrow>=14.0"]
polars = ["polars>=1.0"]

[project.urls]
Homepage = "https://github.com/GabrielMarquezMatte/FixedWidthParser"

[tool.hatch.build.targets.wheel]
packages = ["src/fixedwidth"]
exclude = ["src/fixedwidth/_lib"]

[tool.hatch.build.targets.wheel.force-include]
"src/fixedwidth/_lib" = "fixedwidth/_lib"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
